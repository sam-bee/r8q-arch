[Unit]
# NetworkManager probes nl80211 while starting. Keep that generic-netlink
# request behind the fail-closed USB route wrapper, which establishes the
# only permitted early module set (gpi + i2c_qcom_geni).
Requires=r8q-usb-route.service
After=r8q-usb-route.service

[Service]
# A skipped ConditionPathExists dependency is not a failed Requires edge.
# Refuse to start rather than allowing NM to request cfg80211 before the
# route guard has completed.
ExecStartPre=/usr/bin/systemctl is-active --quiet r8q-usb-route.service
