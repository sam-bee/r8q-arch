# Keep the calibrated amplifier gain fixed; desktop volume is software gain.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.alsa.use-ucm = false
        api.alsa.soft-mixer = true
        api.alsa.disable-mixer-path = true
        device.profile-set = "r8q-cs35l41.conf"
        device.profile = "output:r8q-speakers"
        device.description = "Phone speakers"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        node.description = "Phone speakers"
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
