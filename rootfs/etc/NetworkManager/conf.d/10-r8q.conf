# r8q: NetworkManager owns WiFi only and sends DHCP DNS to systemd-resolved.
#
# usb0 is the SSH lifeline (172.16.42.1, static, from systemd-networkd's
# 20-usb0.network). If NetworkManager took it over it would reconfigure the
# interface on startup and drop every session on it -- including the one you
# are almost certainly using to set this up. Keep it unmanaged.
#
# The USB link remains networkd-managed and is the SSH lifeline. Resolved can
# merge its DNS with the USB fallback while preferring DHCP DNS from WiFi.
[main]
dns=systemd-resolved

# A failed external connectivity probe adds 20000 to the WiFi route metric,
# making USB win despite successful association. Test real upstream access
# during bring-up and retain the configured WiFi/USB priority afterward.
[connectivity]
enabled=false

[keyfile]
unmanaged-devices=interface-name:usb0

# Keep scan addresses consistent; use a stable per-connection address below
# because firmware can supply a default or changing hardware address.
[device]
wifi.scan-rand-mac-address=no

# NetworkManager's WiFi default route must win over networkd's USB fallback
# route (metric 1000), while the USB on-link SSH route remains unaffected.
[connection-wifi]
match-device=type:wifi
ipv4.route-metric=50
ipv6.route-metric=50

[connection]
wifi.cloned-mac-address=stable
# Keep incoming SSH responsive during hardware bring-up; the firmware's
# power-save mode can delay neighbor discovery and initial connections.
wifi.powersave=2
