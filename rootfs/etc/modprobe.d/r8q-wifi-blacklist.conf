# r8q: suppress alias-based coldplug of the WiFi stack at boot, including the
# nl80211 generic-netlink alias. NetworkManager also waits for the route unit.
# The explicit r8q-wifi.service load is ordered after the
# proven USB route, which has already settled the GENI controllers used by the
# route diagnostics. Direct modprobe calls from that unit intentionally load
# these modules despite this blacklist.
#
# cfg80211 has the net-pf-16-proto-16-family-nl80211 alias, and rfkill has the
# /dev/rfkill aliases. mac80211, ath11k, qmi_helpers, and libarc4 are included
# because they are dependencies of the deliberate ath11k load; keep the entire
# closure cold until the route and WiFi units take ownership of the sequence.
# Blacklisting suppresses aliases, not an explicit named modprobe request;
# the service ordering is required as well as this policy.
blacklist cfg80211
# Crypto API SHA-256 is modular on RTC2 and needed for signed regdb checks.
blacklist sha256
blacklist rfkill
blacklist mac80211
blacklist qmi_helpers
blacklist libarc4
blacklist ath
blacklist phy_qcom_qmp_pcie
blacklist pwrseq_qcom_wcn
blacklist pci_pwrctrl_pwrseq
blacklist ath11k_pci
blacklist ath11k
blacklist mhi
blacklist qrtr
blacklist qrtr_mhi
