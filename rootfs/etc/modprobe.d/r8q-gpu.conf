# Keep the complete RTC2 Adreno/MSM module closure out of alias-driven coldplug.
# The strict USB route wrapper must establish its GPI/GENI-only module set first;
# r8q-gpu.service then uses explicit named modprobe requests, which are allowed
# to load these blacklisted modules and their dependencies deliberately.
#
# The closure is the 11 GPU/DRM/QCom/CEC modules in the RTC2 staging manifest.
# In particular, llcc_qcom must not be pulled in by an early Qualcomm alias.
blacklist drm_display_helper
blacklist drm_dp_aux_bus
blacklist drm_exec
blacklist drm_gpuvm
blacklist gpu_sched
blacklist msm
# Samsung-signed zap plus the dynamic DMA region are required for PAS auth;
# the DT carveout 0x8681a000 causes a Samsung TZ reset during authentication.
blacklist cec
blacklist llcc_qcom
blacklist mdt_loader
blacklist ocmem
blacklist ubwc_config
options msm separate_gpu_kms=1 r8q_zap_dyn=1 r8q_zap_secvid=0
