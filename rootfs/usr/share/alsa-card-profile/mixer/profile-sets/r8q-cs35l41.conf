; The r8q card exposes one stereo playback PCM and no capture PCM.
[General]
auto-profiles = no

[Mapping r8q-speakers]
description = Phone speakers
device-strings = hw:%f,0
channel-map = left,right
direction = output

[Profile output:r8q-speakers]
description = Phone speakers
output-mappings = r8q-speakers
priority = 100
